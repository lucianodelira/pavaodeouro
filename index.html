  <script>
    /* ========== BANNER WHATSAPP ========== */
    function podeUsarLocalStorage() {
      try {
        const teste = '__teste_ls__';
        localStorage.setItem(teste, teste);
        localStorage.removeItem(teste);
        return true;
      } catch (e) {
        return false;
      }
    }
    
    function deveMostrarBanner() {
      if (!podeUsarLocalStorage()) return true;
      try {
        const hoje = new Date().toDateString();
        const ultimaExibicao = localStorage.getItem('whatsBannerUltimaExibicao');
        return ultimaExibicao !== hoje;
      } catch (e) {
        return true;
      }
    }
    
    function marcarBannerComoExibido() {
      if (!podeUsarLocalStorage()) return;
      try {
        localStorage.setItem('whatsBannerUltimaExibicao', new Date().toDateString());
      } catch (e) {}
    }
    
    function fecharWhatsBanner() {
      const banner = document.getElementById("whats-banner");
      if (!banner) return;
      marcarBannerComoExibido();
      banner.classList.add("whats-banner-fechando");
      setTimeout(() => banner.remove(), 250);
    }
    
    document.addEventListener('DOMContentLoaded', function () {
      const banner = document.getElementById("whats-banner");
      if (!banner) return;
      
      if (deveMostrarBanner()) {
        setTimeout(() => {
          banner.style.display = "block";
        }, 8000); // aparece após 8 segundos
      } else {
        banner.remove();
      }
    });
  </script>
