crossorigin="anonymous"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:#fff;
text-align:center;
}

header{
background:linear-gradient(45deg,#d4af37,#000);
padding:20px;
font-size:26px;
font-weight:bold;
}

main{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:#1c1c1c;
padding:25px;
margin:20px 0;
border-radius:15px;
box-shadow:0 0 25px rgba(255,215,0,0.3);
}

.resultado{
font-size:22px;
color:#ffd700;
font-weight:bold;
}

.horario{
font-size:14px;
opacity:0.7;
}

/* BOTÕES */
@keyframes pulse {
0% {transform: scale(1); box-shadow:0 0 10px #ffd700;}
50% {transform: scale(1.08); box-shadow:0 0 30px #ffd700;}
100% {transform: scale(1);}
}

.btn{
display:block;
width:100%;
max-width:400px;
margin:10px auto;
padding:18px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#ffd700,#ff9900);
color:#000;
cursor:pointer;
animation:pulse 1.5s infinite;
}

/* IFRAME */
#iframeContainer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:none;
z-index:9999;
}

#iframeContainer iframe{
width:100%;
height:100%;
border:none;
}

#fechar{
position:absolute;
top:10px;
right:10px;
background:red;
color:#fff;
border:none;
padding:10px;
cursor:pointer;
}

/* POPUP */
#popupOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
display:none;
z-index:99999;
align-items:center;
justify-content:center;
flex-direction:column;
}

#popupOverlay button{
margin-top:15px;
padding:15px;
font-size:18px;
background:#ffd700;
border:none;
border-radius:10px;
cursor:pointer;
}

/* CONTADOR */
#contador{
font-size:18px;
color:#00ffcc;
margin-top:10px;
}

</style>

<body>

<header>🔥 BANCA PAVÃO DE OURO 🔥</header>

<main>

<h1>Resultado da Banca Pavão de Ouro Hoje</h1>

<div class="card">
<h2>Manhã</h2>
<div id="manha" class="resultado"></div>
<div id="horaManha" class="horario"></div>
</div>

<div class="card">
<h2>Tarde</h2>
<div id="tarde" class="resultado"></div>
<div id="horaTarde" class="horario"></div>
</div>

<div class="card">
<h2>Noite</h2>
<div id="noite" class="resultado"></div>
<div id="horaNoite" class="horario"></div>
</div>

<!-- BOTÕES -->
<div class="card">
<h2>🎮 Jogar Agora</h2>

<button class="btn" onclick="abrirIframe()">🎰 Cassino</button>
<button class="btn" onclick="abrirIframe()">🎯 Loterias</button>
<button class="btn" onclick="abrirIframe()">🎱 Bingo</button>
<button class="btn" onclick="abrirIframe()">🪙 Raspadinha</button>
<button class="btn" onclick="abrirIframe()">⚽ Futebol</button>

<div id="contador"></div>

</div>

</main>

<footer>© 2026</footer>

<!-- IFRAME -->
<div id="iframeContainer">
<iframe id="meuIframe"></iframe>
<button id="fechar" onclick="fecharIframe()">✖</button>
</div>

<!-- POPUP -->
<div id="popupOverlay">
<h2>🔥 Entre Agora 🔥</h2>
<p>Comece a jogar e tente a sorte!</p>

<button onclick="abrirIframe()">🎰 ENTRAR</button>
<button onclick="fecharPopup()">❌ Fechar</button>
</div>

<script>

/* RESULTADOS (mantido igual) */
function gerarNumero(){
return Math.floor(Math.random()*10000).toString().padStart(4,'0');
}

function gerarResultado(){
let lista=[];
for(let i=0;i<5;i++){
lista.push(gerarNumero());
}
return lista.join(" - ");
}

function atualizar(){
let agora = new Date();
let hora = agora.getHours().toString().padStart(2,'0');
let minuto = agora.getMinutes().toString().padStart(2,'0');
let horario = "Atualizado às " + hora + ":" + minuto;

document.getElementById("manha").innerHTML = gerarResultado();
document.getElementById("tarde").innerHTML = gerarResultado();
document.getElementById("noite").innerHTML = gerarResultado();

document.getElementById("horaManha").innerHTML = horario;
document.getElementById("horaTarde").innerHTML = horario;
document.getElementById("horaNoite").innerHTML = horario;
}

atualizar();
setInterval(atualizar,30000);

/* IFRAME */
function abrirIframe(){
document.getElementById("iframeContainer").style.display = "block";
document.getElementById("meuIframe").src = "https://app.bancavaidarboa.club/pr/d032gM1o";
}

function fecharIframe(){
document.getElementById("iframeContainer").style.display = "none";
document.getElementById("meuIframe").src = "";
}

/* POPUP AUTOMÁTICO */
setTimeout(function(){
document.getElementById("popupOverlay").style.display = "flex";
},5000);

function fecharPopup(){
document.getElementById("popupOverlay").style.display = "none";
}

/* CONTADOR DINÂMICO */
function atualizarContador(){
let numero = Math.floor(Math.random()*50)+120;
document.getElementById("contador").innerHTML =
"👥 " + numero + " pessoas jogando agora";
}

setInterval(atualizarContador,3000);
atualizarContador();

</script>

</body>
</html>
